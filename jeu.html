<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>École AUDACE — Construis ton business en 2 minutes</title>
<meta name="description" content="Choisis ta voie, crée ton produit, poste ta première vidéo, fais ta première vente. À la fin, tu repars avec ton plan.">
<meta property="og:title" content="École AUDACE — Construis ton business en 2 minutes">
<meta property="og:description" content="Choisis ta voie, crée ton produit, poste ta première vidéo, fais ta première vente. À la fin, tu repars avec ton plan.">
<meta property="og:image" content="https://audaceschool.com/img/og.jpg">
<link rel="canonical" href="https://audaceschool.com/jeu.html">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--dark:#3D0410;--ink:#2A0A10;--bord:#8B0A26;--rose:#F6CCD5;--pink:#F2A7B6;--cream:#FBF1EE;--mut:#E3B9C0;--gold:#F5C24E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
[hidden]{display:none!important}
body{overflow:hidden;background:#2A0A10;color:var(--cream);font-family:'Inter','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
.disp{font-family:'Instrument Sans','Inter',sans-serif;font-weight:600;letter-spacing:-.025em}
#bg{position:fixed;inset:0;background:radial-gradient(90% 70% at 68% 42%,#6A0A1E 0%,#4A0613 38%,#2A0A10 100%)}
#bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
#bg i:nth-child(1){width:44vmax;height:44vmax;left:-14vmax;bottom:-18vmax;background:#8B0A26}
#bg i:nth-child(2){width:30vmax;height:30vmax;right:-8vmax;top:-12vmax;background:#B3213F;opacity:.35}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
#app{position:fixed;inset:0;z-index:3;display:grid;grid-template-rows:auto 1fr;height:100dvh}
#top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(16px,env(safe-area-inset-top)) 22px 0}
#logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--cream)}
#logo i{width:24px;height:24px;border-radius:50%;background:var(--rose);display:block}
#logo b{font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:18px;letter-spacing:.14em}
#hud{display:flex;gap:8px;opacity:0;transition:opacity .4s}
.live #hud{opacity:1}
.chip{white-space:nowrap;display:flex;align-items:baseline;gap:7px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12px;font-weight:600;color:var(--mut)}
.chip b{font-family:'Instrument Sans',sans-serif;font-size:17px;color:#fff;font-variant-numeric:tabular-nums}
.chip.e{background:var(--rose);color:#6E0820}.chip.e b{color:var(--dark)}
.chip.pop{animation:pop .4s ease}
@keyframes pop{40%{transform:scale(1.14)}}
#main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:24px;max-width:1180px;width:100%;margin:0 auto;padding:10px 32px 28px;min-height:0}
#panel{min-width:0;max-width:520px;justify-self:end;width:100%}
#prog{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:26px;opacity:0;transition:opacity .4s}
.live #prog{opacity:1}
#prog i{display:block;height:100%;width:0;border-radius:3px;background:var(--rose);transition:width .6s cubic-bezier(.2,.8,.2,1)}
#pin{transition:opacity .22s ease,transform .3s cubic-bezier(.2,.8,.2,1)}
#pin.out{opacity:0;transform:translateY(14px)}
.k{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--pink)}
h1,h2{margin:12px 0 0;font-family:'Instrument Sans','Inter',sans-serif;font-weight:600;letter-spacing:-.025em;line-height:1.04}
h1{font-size:clamp(40px,5.4vw,68px)}
h2{font-size:clamp(30px,3.6vw,46px)}
.sub{margin:14px 0 0;font-size:17px;line-height:1.55;color:#F0D5D3;max-width:460px}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border:0;border-radius:18px;background:rgba(255,255,255,.09);text-align:left;cursor:pointer;transition:transform .18s ease,background .18s ease}
.opt:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.opt:active{transform:scale(.98)}
.opt.sel{background:var(--rose);color:var(--dark)}
.opt.bad{animation:shake .4s;opacity:.45;pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.opt .ic{flex:none;width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.opt.sel .ic{background:rgba(61,4,16,.12)}
.opt svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opt b{display:block;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:18px;letter-spacing:-.01em}
.opt span{display:block;margin-top:3px;font-size:14px;line-height:1.4;opacity:.78}
.opt em{margin-left:auto;flex:none;font-style:normal;font-weight:600;font-size:14px;opacity:.85;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.chips button{padding:12px 18px;border:0;border-radius:999px;background:rgba(255,255,255,.1);font-weight:600;font-size:15px;cursor:pointer;transition:transform .18s ease,background .18s ease}
.chips button:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.chips button.sel{background:var(--rose);color:var(--dark)}
.row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.inp{flex:1 1 180px;min-width:0;height:54px;padding:0 20px;border:0;border-radius:999px;background:rgba(255,255,255,.12);font-size:16px;font-weight:500;outline:none}
.inp::placeholder{color:#D9A9B1}
.inp:focus{background:rgba(255,255,255,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 28px;border:0;border-radius:999px;background:var(--rose);color:var(--dark);font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .18s ease,background .18s ease}
.btn:hover{background:#fff;transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.big{min-height:62px;padding:0 34px;font-size:18px;width:100%}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--cream)}
.btn.ghost:hover{background:rgba(255,255,255,.2)}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.035)}}
.lnk{display:inline-block;margin-top:16px;border:0;background:none;padding:6px 0;font-size:14px;font-weight:500;color:var(--mut);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.coach{display:flex;align-items:center;gap:12px;margin-top:22px;padding:12px 16px 12px 12px;border-radius:18px;background:rgba(0,0,0,.2)}
.coach .av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--rose) center/cover;color:var(--dark);display:grid;place-items:center;font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:15px}
.coach p{margin:0;font-size:14px;line-height:1.45;color:#F0D5D3}
.coach b{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--pink);margin-bottom:2px}
.note{margin:14px 0 0;font-size:12px;line-height:1.5;color:#C99AA2}
.sim{margin-top:18px;padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.09);font-size:15px;line-height:1.5}
.sim b{font-family:'Instrument Sans',sans-serif;font-size:22px;color:#fff}
/* ---------- téléphone ---------- */
#stage{position:relative;height:100%;min-height:0;display:grid;place-items:center;perspective:1500px}
#ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:min(46vh,34vw);letter-spacing:-.05em;color:rgba(255,255,255,.045);pointer-events:none;transition:opacity .4s;white-space:nowrap}
#fit{width:300px;height:620px;transform-origin:center}
#tilt{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(var(--rx,6deg)) rotateY(var(--ry,-18deg));transition:transform .25s ease-out}
#phone{position:relative;width:100%;height:100%;border-radius:48px;padding:10px;background:#16050A;transform-style:preserve-3d;animation:float 6s ease-in-out infinite;
box-shadow:1px 0 0 #4D0D1B,2px 1px 0 #4D0D1B,3px 1px 0 #47101B,4px 2px 0 #401019,5px 2px 0 #3A0E17,6px 3px 0 #340C15,7px 3px 0 #2E0A12,8px 4px 0 #280810,40px 60px 90px rgba(0,0,0,.5),0 0 120px rgba(246,204,213,.12)}
#phone.spin{animation:spin .7s cubic-bezier(.3,.7,.2,1)}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes spin{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(.92)}100%{transform:rotateY(360deg) scale(1)}}
#screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:#fff;color:#1E0A0E;font-size:13px}
#screen::after{content:"";position:absolute;inset:0;border-radius:38px;background:linear-gradient(125deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 32%);pointer-events:none}
#notch{position:absolute;z-index:5;top:9px;left:50%;width:84px;height:24px;margin-left:-42px;border-radius:14px;background:#16050A}
.scr{position:absolute;inset:0;padding:46px 16px 16px;display:flex;flex-direction:column;animation:scr .4s ease both}
@keyframes scr{from{opacity:0;transform:translateY(12px)}}
.scr.c{align-items:center;justify-content:center;text-align:center}
.scr h3{margin:0;font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.02em}
.dot{width:74px;height:74px;border-radius:50%;background:var(--bord);animation:pulse 2.4s ease-in-out infinite}
.tile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:#F6EEEC;margin-top:10px;font-weight:600;font-size:14px;transition:all .3s}
.tile svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tile.on{background:var(--bord);color:#fff;transform:scale(1.04)}
.tile.off{opacity:.35}
.lbl{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A98F93}
.line{margin-top:14px}
.line b{display:block;margin-top:4px;font-family:'Instrument Sans',sans-serif;font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.caret::after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;background:var(--bord);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.prod{margin-top:14px;border-radius:22px;background:var(--bord);color:#fff;padding:20px 18px;animation:drop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.9)}}
.prod .lbl{color:var(--pink)}
.prod b{display:block;margin-top:8px;font-family:'Instrument Sans',sans-serif;font-size:22px;line-height:1.12;letter-spacing:-.02em}
.prod span{display:inline-block;margin-top:14px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:600;font-size:13px}
.ok{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:600;font-size:13px;color:#1F7A4D}
.ok i{width:20px;height:20px;border-radius:50%;background:#1F7A4D;display:grid;place-items:center}
.ok i::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.todo{margin-top:auto;display:grid;gap:8px}
.todo div{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:#F6EEEC;font-weight:600;font-size:13px;color:#A39396}
.todo div i{flex:none;width:22px;height:22px;border-radius:50%;background:#E4DAD8;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff}
.todo div.now{background:var(--rose);color:var(--dark)}.todo div.now i{background:var(--bord)}
.todo div.done{color:#1E0A0E}.todo div.done i{background:#1F7A4D;font-size:0}
.todo div.done i::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
/* profil */
.ig-h{font-weight:700;font-size:15px}
.ig-top{display:flex;align-items:center;gap:14px;margin-top:14px}
.ig-av{flex:none;width:68px;height:68px;border-radius:50%;background:#E4DAD8;display:grid;place-items:center;font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:28px;color:#fff;transition:all .5s}
.ig-st{display:flex;flex:1;justify-content:space-around;text-align:center;font-size:11px;color:#8A6D72}
.ig-st b{display:block;font-size:16px;color:#1E0A0E;font-variant-numeric:tabular-nums}
.ig-bio{margin-top:12px;min-height:74px;font-size:13px;line-height:1.45}
.ig-bio b{display:block;font-size:14px}
.ig-bio .ph{display:block;height:11px;border-radius:6px;background:#EEE6E4;margin-top:8px}
.ig-bio span{display:block;animation:scr .4s ease both}
.ig-btn{margin-top:10px;height:36px;border-radius:10px;background:#EEE6E4;color:#A39396;display:grid;place-items:center;font-weight:700;font-size:13px;transition:all .5s}
.ig-hl{display:flex;gap:12px;margin-top:14px}
.ig-hl i{width:46px;height:46px;border-radius:50%;background:#EEE6E4;transition:all .5s}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:14px -16px -16px;flex:1;min-height:0}
.ig-grid i{background:#F3ECEA;position:relative;overflow:hidden;transition:background .5s}
.ig-grid i.v{background:linear-gradient(160deg,#8B0A26,#3D0410);animation:drop .5s cubic-bezier(.2,1.4,.4,1) both}
.ig-grid i.v::after{content:attr(data-v);position:absolute;left:5px;bottom:4px;color:#fff;font-style:normal;font-weight:700;font-size:9px}
.opt8 .ig-av{background:var(--bord);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--pink)}
.opt8 .ig-btn{background:var(--bord);color:#fff}
.opt8 .ig-hl i:nth-child(1){background:var(--rose)}.opt8 .ig-hl i:nth-child(2){background:var(--bord)}.opt8 .ig-hl i:nth-child(3){background:var(--pink)}.opt8 .ig-hl i:nth-child(4){background:var(--dark)}
/* reel */
.reel{position:absolute;inset:0;background:linear-gradient(165deg,#A3122F 0%,#5A0718 55%,#2A0A10 100%);color:#fff;padding:54px 16px 18px;display:flex;flex-direction:column;animation:scr .4s ease both}
.reel .tag{align-self:flex-start;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.reel .hook{margin-top:auto;margin-bottom:auto;font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:27px;line-height:1.1;letter-spacing:-.025em;padding-right:44px}
.reel .side{position:absolute;right:12px;bottom:96px;display:grid;gap:14px;text-align:center;font-size:10px;font-weight:700}
.reel .side svg{display:block;width:28px;height:28px;margin:0 auto 4px;fill:#fff}
.reel .views{display:flex;align-items:baseline;gap:8px}
.reel .views b{font-family:'Instrument Sans',sans-serif;font-size:34px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.reel .who{margin-top:6px;font-size:12px;font-weight:600;opacity:.85}
.reel.posted .tag{background:#fff;color:var(--bord)}
/* chat */
.chat-h{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.chat-h i{width:34px;height:34px;border-radius:50%;background:var(--rose)}
.chat-h b{font-size:14px}
.chat-h span{display:block;font-size:11px;color:#8A6D72;font-weight:500}
#msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:7px}
.m{max-width:84%;padding:10px 13px;border-radius:18px;font-size:13px;line-height:1.35;animation:msg .35s cubic-bezier(.2,1.3,.4,1) both}
@keyframes msg{from{opacity:0;transform:translateY(14px) scale(.9)}}
.m.them{align-self:flex-start;background:#F1E9E7;border-bottom-left-radius:6px}
.m.me{align-self:flex-end;background:var(--bord);color:#fff;border-bottom-right-radius:6px}
.m.typ{display:flex;gap:4px;padding:14px}
.m.typ i{width:6px;height:6px;border-radius:50%;background:#B8A5A8;animation:typ 1s infinite}
.m.typ i:nth-child(2){animation-delay:.15s}.m.typ i:nth-child(3){animation-delay:.3s}
@keyframes typ{30%{transform:translateY(-4px)}}
/* résultat */
.pay{display:flex;align-items:center;gap:11px;padding:12px;border-radius:18px;background:#F6EEEC;margin-top:9px;animation:drop .55s cubic-bezier(.2,1.4,.4,1) both}
.pay i{flex:none;width:36px;height:36px;border-radius:11px;background:#1F7A4D;display:grid;place-items:center}
.pay i::after{content:"";width:12px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translateY(-2px)}
.pay div{min-width:0}
.pay b{display:block;font-size:13px}
.pay span{display:block;font-size:11px;color:#8A6D72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pay em{margin-left:auto;flex:none;white-space:nowrap;font-style:normal;font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:16px}
.tot{margin-top:auto;border-radius:22px;background:var(--bord);color:#fff;padding:18px;text-align:center}
.tot .lbl{color:var(--pink)}
.tot b{display:block;margin-top:4px;font-family:'Instrument Sans',sans-serif;font-size:40px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
@media (max-width:860px){
#main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:6px;padding:4px 16px max(14px,env(safe-area-inset-bottom));align-items:stretch}
#stage{order:1;min-height:40dvh}
#panel{order:2;max-width:none;justify-self:stretch;max-height:52dvh;overflow-y:auto;overscroll-behavior:contain;padding-top:4px}
#prog{margin-bottom:14px}
h1{font-size:36px}h2{font-size:27px;margin-top:8px}
.sub{font-size:15px;margin-top:8px;line-height:1.45}
.opts{margin-top:14px;gap:8px}.opt{padding:11px 13px;border-radius:15px;gap:11px}.opt .ic{width:38px;height:38px}.opt b{font-size:16px}.opt span{font-size:13px;margin-top:1px}
.chips{margin-top:14px;gap:7px}.chips button{padding:10px 15px;font-size:14px}
.row{margin-top:14px}.coach{margin-top:12px;padding:9px 12px 9px 9px}.coach .av{width:36px;height:36px}.coach p{font-size:13px}
.k{font-size:11px}.lnk{margin-top:8px}.sim{margin-top:12px;padding:12px 14px}.note{margin-top:8px}
.btn.big{min-height:58px;font-size:17px}
#ghost{font-size:44vw}
.intro #stage{min-height:120px}
#top{padding-left:16px;padding-right:16px}.chip{padding:7px 11px;font-size:11px}.chip b{font-size:15px}
}
@media (prefers-reduced-motion:reduce){#phone,.dot,.btn.pulse{animation:none}#tilt{transition:none}}
</style>
</head>
<body class="intro">
<div id="bg"><i></i><i></i></div>
<div id="app">
<header id="top">
<a id="logo" href="./" aria-label="École AUDACE, retour au site"><i></i><b>AUDACE</b></a>
<div id="hud">
<div class="chip" id="c-f"><b id="hud-f">0</b> abonnés</div>
<div class="chip e" id="c-e" hidden><b id="hud-e">0 €</b></div>
</div>
</header>
<main id="main">
<section id="panel">
<div id="prog"><i></i></div>
<div id="pin"></div>
</section>
<section id="stage" aria-hidden="true">
<div id="ghost"></div>
<div id="fit"><div id="tilt"><div id="phone"><div id="screen"><div id="notch"></div><div id="scr"></div></div></div></div></div>
</section>
</main>
</div>
<canvas id="fx"></canvas>
<noscript><p style="position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#3D0410;margin:0;padding:24px;text-align:center">Cette page a besoin de JavaScript. <a href="./" style="color:#F6CCD5">Voir le site de l'École AUDACE</a></p></noscript>
<script type="module" src="jeu.js"></script>
</body>
</html>
