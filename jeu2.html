<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>École AUDACE — Trouve tes premiers clients</title>
<meta name="description" content="Fais, en 2 minutes, les 4 étapes de la méthode AUDACE : ton offre, ton contenu, tes messages, ton appel.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Trouve tes premiers clients grâce à internet">
<meta property="og:description" content="Le jeu de l'École AUDACE : les 4 étapes de la méthode, en 2 minutes.">
<meta property="og:image" content="https://audaceschool.com/img/og.jpg">
<meta name="theme-color" content="#0B0406">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600;700&family=Inter:ital,wght@0,500;0,600;0,700;0,800;0,900;1,900&display=swap">
<style>
:root{--bg:#0B0406;--card:#170A0E;--card2:#21101500;--ink:#FBF7F2;--mut:rgba(251,247,242,.72);--rose:#F6CCD5;--red:#F2365F;--bord:#8B0A26;--dark:#3D0410;--gold:#FFC94D;--green:#2BD67B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Inter','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0}
#bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 18s ease-in-out infinite alternate}
#bg i:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-25vmax;background:#5E0619}
#bg i:nth-child(2){width:50vmax;height:50vmax;right:-22vmax;bottom:-20vmax;background:#8B0A26;animation-duration:22s;opacity:.4}
#bg i:nth-child(3){width:28vmax;height:28vmax;left:40%;top:45%;background:#F2365F;opacity:.13;animation-duration:26s}
#bg:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/64px 64px}
@keyframes float{to{transform:translate(6vmax,5vmax) scale(1.12)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
#flash{position:fixed;inset:0;z-index:29;pointer-events:none;background:#fff;opacity:0}
#flash.on{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}

/* barre du haut */
#top{position:fixed;z-index:20;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 16px 10px}
#logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);flex:none}
#logo i{width:20px;height:20px;border-radius:50%;background:var(--bord);box-shadow:0 0 14px rgba(242,54,95,.6)}
#logo b{font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:16px;letter-spacing:.12em}
#steps{flex:1;display:flex;gap:6px;justify-content:center;opacity:0;transition:opacity .4s}
#steps.on{opacity:1}
.st{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 4px;border-radius:999px;background:rgba(255,255,255,.07);font-size:12px;font-weight:700;color:rgba(251,247,242,.5);transition:all .35s cubic-bezier(.2,.9,.3,1.3)}
.st b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:11px;font-weight:800}
.st.cur{background:rgba(242,54,95,.18);color:#fff}
.st.cur b{background:var(--red);color:#fff;box-shadow:0 0 14px rgba(242,54,95,.8)}
.st.ok{color:var(--rose)}
.st.ok b{background:var(--rose);color:var(--dark)}
.st.pop{animation:stp .6s cubic-bezier(.2,.9,.3,1.4)}
@keyframes stp{40%{transform:scale(1.25)}}
#snd{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center}
#snd svg{width:18px;height:18px}
@media (max-width:620px){.st span{display:none}.st{padding:0 4px}.st.cur span{display:inline}.st.cur{padding-right:10px}#logo b{display:none}}

/* scène */
#stage{position:fixed;inset:0;z-index:5}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(max(12px,env(safe-area-inset-top)) + 62px) 18px calc(max(18px,env(safe-area-inset-bottom)) + 10px);display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(26px) scale(.985);transition:opacity .45s ease,transform .6s cubic-bezier(.2,.85,.25,1)}
.scr.in{opacity:1;transform:none}
.scr.out{opacity:0;transform:translateY(-24px) scale(.985);pointer-events:none}
.col{width:100%;max-width:460px;margin:auto 0;display:flex;flex-direction:column}
.c{text-align:center;align-items:center}
.rv{opacity:0;transform:translateY(16px);animation:rv .55s cubic-bezier(.2,.85,.25,1) forwards}
@keyframes rv{to{opacity:1;transform:none}}
.k{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
h1,h2{margin:12px 0 0;font-family:'Inter',sans-serif;font-weight:900;letter-spacing:-.02em;line-height:1.04;color:#fff}
h1{font-size:clamp(34px,9vw,54px);text-transform:uppercase;text-shadow:0 0 34px rgba(255,255,255,.14)}
h2{font-size:clamp(26px,7vw,36px)}
.p{margin:12px 0 0;font-size:16.5px;line-height:1.5;color:var(--mut);font-weight:500}
.p b{color:#fff;font-weight:700}
.small{font-size:13px;color:rgba(251,247,242,.55);font-weight:500;line-height:1.45}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;width:100%;margin-top:22px;padding:0 24px;border:0;border-radius:999px;background:linear-gradient(90deg,#C21A47,#F2365F);color:#fff;font-weight:900;font-size:clamp(15px,4.2vw,17px);white-space:nowrap;letter-spacing:.01em;text-decoration:none;box-shadow:0 0 0 6px rgba(194,26,71,.22),0 10px 34px rgba(242,54,95,.45);transition:transform .15s ease}
.btn:active{transform:scale(.97)}
.btn.pulse{animation:pls 1.7s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.03);box-shadow:0 0 0 12px rgba(194,26,71,.16),0 10px 40px rgba(242,54,95,.6)}}
.btn.soft{background:rgba(255,255,255,.09);box-shadow:none;font-weight:800}
.lnk{display:inline-block;margin-top:16px;border:0;background:none;color:rgba(251,247,242,.6);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* intro */
.prev{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:26px;width:100%}
.prev div{padding:14px 6px 12px;border-radius:18px;background:rgba(255,255,255,.06);font-size:12px;font-weight:700;color:var(--mut)}
.prev b{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 8px;border-radius:50%;background:rgba(242,54,95,.2);color:#fff;font-weight:900}

/* cartes de choix */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;width:100%}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.opt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:86px;padding:16px;border:0;border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);text-align:left;font-weight:800;font-size:15.5px;line-height:1.2;transition:transform .2s cubic-bezier(.2,.9,.3,1.4),box-shadow .2s,background .2s}
.opt em{font-style:normal;font-size:26px;line-height:1}
.g3 .opt{min-height:92px;align-items:center;text-align:center;padding:14px 6px;font-size:13.5px}
.opt:active{transform:scale(.95)}
.opt.sel{background:#3B0A17;box-shadow:inset 0 0 0 2px var(--red),0 0 26px rgba(242,54,95,.45);transform:scale(1.04)}
.big2{display:flex;flex-direction:column;gap:10px;margin-top:22px;width:100%}
.big2 .opt{min-height:74px;flex-direction:row;align-items:center;font-size:17px;padding:18px 20px}
.ans{margin-top:18px;padding:22px;border-radius:24px;background:linear-gradient(160deg,#3B0A17,#1C070C);box-shadow:0 0 0 2px rgba(242,54,95,.35),0 20px 50px rgba(0,0,0,.4);text-align:left;width:100%}
.ans h2{margin:0;font-size:28px}

/* prénom */
.inp{display:block;width:100%;height:62px;margin-top:22px;padding:0 24px;border:0;border-radius:999px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);font-size:20px;font-weight:700;outline:none;text-align:center}
.inp:focus{box-shadow:inset 0 0 0 2px var(--red),0 0 24px rgba(242,54,95,.35)}
.inp::placeholder{color:rgba(251,247,242,.4)}
.prof{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px 18px;border-radius:22px;background:var(--card);width:100%;text-align:left}
.av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#F2365F,#8B0A26);font-weight:900;font-size:20px;color:#fff;box-shadow:0 0 0 3px #0B0406,0 0 0 5px var(--red)}
.prof b{display:block;font-size:17px}
.prof span{font-size:13px;color:var(--mut);font-weight:600}
.prof .nums{margin-left:auto;display:flex;gap:16px;text-align:center}
.prof .nums b{font-size:16px}
.prof .nums span{font-size:11px}

/* carte offre */
.offer{position:relative;margin-top:22px;width:100%;padding:28px 24px;border-radius:28px;background:linear-gradient(150deg,#C21A47 0%,#5E0619 70%);box-shadow:0 30px 70px rgba(194,26,71,.45);text-align:left;overflow:hidden;animation:forge .9s cubic-bezier(.2,.9,.3,1.3) both}
.offer:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);transform:translateX(-100%);animation:shine 1.4s .5s ease-out forwards}
@keyframes forge{0%{transform:scale(.6) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes shine{to{transform:translateX(100%)}}
.offer small{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
.offer b{display:block;margin-top:10px;font-size:32px;font-weight:900;line-height:1.05;letter-spacing:-.02em}
.offer span{display:block;margin-top:8px;font-weight:700;color:#FFE1E7}
.stamp{position:absolute;right:16px;top:16px;padding:8px 12px;border-radius:12px;background:#fff;color:var(--bord);font-size:12px;font-weight:900;letter-spacing:.06em;transform:rotate(8deg);animation:stamp .5s 1s cubic-bezier(.2,.9,.3,1.5) both}
@keyframes stamp{0%{transform:scale(3) rotate(8deg);opacity:0}100%{transform:rotate(8deg);opacity:1}}

/* feed */
.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px;width:100%}
.th{position:relative;aspect-ratio:9/15;border:0;border-radius:16px;overflow:hidden;padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;color:#fff;transition:transform .2s cubic-bezier(.2,.9,.3,1.4)}
.th:active{transform:scale(.94)}
.th .cap{font-size:11.5px;font-weight:800;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.th .who{position:absolute;left:8px;top:8px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.25)}
.th .cap{margin-top:30px}
.th .vw{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:900;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.th .vw svg{width:11px;height:11px}
.th.no{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.th.yes{box-shadow:0 0 0 3px var(--gold),0 0 34px rgba(255,201,77,.6);z-index:2;animation:yes .6s cubic-bezier(.2,.9,.3,1.4)}
@keyframes yes{50%{transform:scale(1.12)}}
.avg{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.07);font-size:13px;font-weight:700;color:var(--mut)}
.avg b{color:#fff}
.hint{min-height:22px;margin-top:12px;font-size:14px;font-weight:700;color:var(--rose)}

/* pourquoi */
.duo{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px;width:100%}
.duo .th{width:118px;flex:none;cursor:default}
.duo .arr{font-size:26px;font-weight:900;color:var(--rose)}
.mine{background:linear-gradient(160deg,#2A0D14,#13070A);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.mine .slots{display:flex;flex-direction:column;gap:5px;margin-top:auto;margin-bottom:auto}
.mine .slot{height:22px;border-radius:8px;background:rgba(255,255,255,.06);font-size:10px;font-weight:800;display:grid;place-items:center;color:transparent;transition:all .3s}
.mine .slot.f{background:var(--red);color:#fff;box-shadow:0 0 14px rgba(242,54,95,.7);animation:yes .4s}
.mine.ready{background:linear-gradient(160deg,#C21A47,#4A0514);box-shadow:0 0 0 3px var(--rose),0 0 30px rgba(242,54,95,.6)}
.badge{position:absolute;right:-8px;top:-10px;z-index:3;padding:6px 10px;border-radius:999px;background:var(--gold);color:#2A1500;font-size:13px;font-weight:900;box-shadow:0 6px 18px rgba(255,201,77,.5);animation:stamp .5s cubic-bezier(.2,.9,.3,1.5) both}
.wrapth{position:relative}
.pills{display:flex;flex-direction:column;gap:9px;margin-top:18px;width:100%}
.pill{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 2px rgba(242,54,95,.35);text-align:left;transition:transform .2s,opacity .3s}
.pill b{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(242,54,95,.2);font-weight:900}
.pill strong{display:block;font-size:16px;font-weight:900}
.pill span{display:block;font-size:13.5px;color:var(--mut);font-weight:600;margin-top:2px}
.pill.go{animation:pg 1.6s ease-in-out infinite}
@keyframes pg{50%{box-shadow:inset 0 0 0 2px var(--red),0 0 22px rgba(242,54,95,.45)}}
.pill.used{opacity:.35;transform:scale(.97);pointer-events:none}
.flyer{position:fixed;z-index:31;padding:8px 14px;border-radius:999px;background:var(--red);color:#fff;font-weight:900;font-size:13px;pointer-events:none;box-shadow:0 0 20px rgba(242,54,95,.8);transition:all .55s cubic-bezier(.5,0,.3,1)}

/* bouton maintenir */
.hold{position:relative;margin-top:22px;width:100%;height:68px;border:0;border-radius:999px;overflow:hidden;background:#2A0C13;font-weight:900;font-size:17px;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 2px rgba(242,54,95,.5)}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#C21A47,#F2365F,#FF7A95)}
.hold span{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;height:100%}
.hold.idle{animation:pls 1.7s ease-in-out infinite}

/* explosion */
.vid{position:relative;width:min(240px,62vw);aspect-ratio:9/15;margin-top:6px;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,#C21A47,#4A0514);box-shadow:0 0 0 3px rgba(255,255,255,.12),0 30px 80px rgba(242,54,95,.4);display:flex;flex-direction:column;justify-content:center;padding:18px;text-align:center}
.vid .cap{font-size:18px;font-weight:900;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.vid .hd{position:absolute;left:14px;bottom:14px;font-size:13px;font-weight:800}
.vid .side{position:absolute;right:10px;bottom:14px;display:flex;flex-direction:column;gap:14px;align-items:center;font-size:11px;font-weight:800}
.vid .side svg{width:26px;height:26px;display:block;margin:0 auto 2px}
.vid.beat{animation:beat .35s}
@keyframes beat{50%{transform:scale(1.035)}}
.stats{display:flex;gap:10px;margin-top:18px;width:100%}
.stats div{flex:1;padding:12px 6px;border-radius:18px;background:var(--card);text-align:center}
.stats b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{font-size:12px;font-weight:700;color:var(--mut)}
.stats .main{flex:1.6;background:linear-gradient(160deg,#3B0A17,#1C070C);box-shadow:inset 0 0 0 2px rgba(242,54,95,.4)}
.stats .main b{font-size:28px}
#toasts{position:fixed;z-index:25;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 56px);width:min(400px,calc(100vw - 28px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(30,14,18,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:13.5px;font-weight:600;animation:tin .4s cubic-bezier(.2,.9,.3,1.3) both}
.toast.bye{animation:tout .35s ease forwards}
.toast i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;background:var(--red)}
.toast b{font-weight:800}
@keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.95)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.95)}}
.zero{margin-top:20px;padding:22px;border-radius:24px;background:#fff;color:var(--dark);text-align:left;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.zero .l1{font-size:15px;font-weight:800;color:#8B0A26}
.zero .l2{margin-top:2px;font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1}
.zero p{margin:10px 0 0;font-size:15.5px;line-height:1.45;font-weight:600;color:#3D0410}

/* messages */
.inbox{display:flex;flex-direction:column;gap:8px;margin-top:18px;width:100%}
.dm{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:18px;background:var(--card);text-align:left;width:100%;animation:tin .4s cubic-bezier(.2,.9,.3,1.3) both}
.dm .av{width:44px;height:44px;font-size:16px;box-shadow:none}
.dm b{display:block;font-size:15px;font-weight:800}
.dm span{display:block;font-size:14px;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.dm .dot{margin-left:auto;flex:none;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.dm.go{box-shadow:inset 0 0 0 2px var(--red),0 0 22px rgba(242,54,95,.4)}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:14px 18px;border-radius:20px;background:linear-gradient(160deg,#3B0A17,#1C070C);box-shadow:inset 0 0 0 2px rgba(242,54,95,.35);width:100%}
.cnt b{font-size:24px;font-weight:900}
.cnt span{font-size:13px;font-weight:700;color:var(--mut)}
.cnt .eur{font-size:24px;font-weight:900;color:#fff;opacity:.5}

/* chat */
.chat{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(max(12px,env(safe-area-inset-top)) + 58px) 0 0}
.chat .hd{display:flex;align-items:center;gap:12px;padding:10px 18px 12px;max-width:500px;width:100%;margin:0 auto}
.chat .hd .av{width:42px;height:42px;font-size:16px;box-shadow:none}
.chat .hd b{display:block;font-size:16px;font-weight:800}
.chat .hd span{font-size:12.5px;color:var(--green);font-weight:700}
.msgs{flex:1;overflow-y:auto;padding:8px 18px 12px;display:flex;flex-direction:column;gap:8px;max-width:500px;width:100%;margin:0 auto}
.b{max-width:80%;padding:11px 15px;border-radius:20px;font-size:15.5px;line-height:1.4;font-weight:600;animation:bin .35s cubic-bezier(.2,.9,.3,1.3) both}
.b.l{align-self:flex-start;background:#2A1419;border-bottom-left-radius:6px}
.b.r{align-self:flex-end;background:linear-gradient(135deg,#F2365F,#C21A47);border-bottom-right-radius:6px;color:#fff}
.b .tag{display:block;font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-bottom:3px}
@keyframes bin{from{opacity:0;transform:translateY(10px) scale(.92)}}
.typing{align-self:flex-start;display:flex;gap:4px;padding:14px 16px;border-radius:20px;background:#2A1419}
.typing i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{30%{transform:translateY(-5px);opacity:1}}
.cal{align-self:center;margin:8px 0;padding:16px 20px;border-radius:20px;background:#fff;color:var(--dark);text-align:center;animation:stamp .5s cubic-bezier(.2,.9,.3,1.5) both}

 '<div class="cnt rv"'+dl(2)+'><div><b id="ni">0</b> <span>personnes intéressées</span></div><div class="eur">0 €</div></div><div id="nx"></div></div>');
 var ib=$('#ib',d),ni=$('#ni',d),k=0,total=list.length+9;
 (function add(){if(k<list.length){var x=list[k],b=document.createElement('button');b.className='dm';b.innerHTML='<div class="av" style="background:linear-gradient(135deg,'+GRAD[(k+2)%6]+')">'+x.n[0]+'</div><div><b>'+x.n+'</b><span>'+esc(x.m)+'</span></div><i class="dot"></i>';if(x.me){b.id='me'}ib.appendChild(b);
   sfx.pop(1+k*.12);vib(10);ni.textContent=++k;setTimeout(add,520)}
  else{roll(ni,k,total,900,fmt).then(function(){S.int=total;
   $('#nx',d).innerHTML='<p class="p rv">Le piège : balancer ton prix direct, et ne plus jamais avoir de réponse. <b>Chez AUDACE, on suit une trame</b> : on pose des questions d’abord, et on propose un appel.</p><button class="btn pulse rv" style="animation-delay:.2s" id="n">Répondre à '+L.n+' →</button>';
   var me=$('#me',d);me.classList.add('go');me.onclick=go;$('#n',d).onclick=go;setTimeout(function(){$('#nx',d).scrollIntoView({behavior:'smooth',block:'end'})},150)})}})();
 function go(){sfx.tap();chat()}}

/* 3b — la conversation, avec la trame */
function chat(){
 var dd=D(),L=lead();
 var SC=[
  {tag:'Sa situation',me:'Hello '+L.n+' ! Oui, carrément. Tu en es où aujourd’hui ?',rep:dd.r[0]},
  {tag:'Son blocage',me:'Ok je vois. Et qu’est-ce qui te bloque, concrètement ?',rep:dd.r[1]},
  {tag:'Son objectif',me:'Et si c’était réglé dans 3 mois, ça changerait quoi pour toi ?',rep:dd.r[2]},
  {tag:'L’appel',me:'Je vois exactement. On s’appelle 15 min demain ? Je te montre comment on ferait.',rep:'Oui grave ! 18 h, ça te va ?'}];
 var d=show('<div class="chat"><div class="hd"><div class="av" style="background:linear-gradient(135deg,'+GRAD[2]+')">'+L.n[0]+'</div><div><b>'+L.n+'</b><span>En ligne</span></div></div>'+
 '<div class="msgs" id="ms"><div class="b l">'+esc(dd.dms[0])+'</div></div>'+
 '<div class="bar"><div class="lab"><i id="sn">1/4</i><span id="sl"></span></div><div class="row"><div class="tx" id="tx"></div><button class="send" id="sd" aria-label="Envoyer" disabled><svg viewBox="0 0 24 24" fill="#fff"><path d="M3.4 20.4 21 12 3.4 3.6l.1 6.5L15 12 3.5 13.9z"/></svg></button></div></div></div>');
 d.style.padding='0';
 var ms=$('#ms',d),tx=$('#tx',d),sd=$('#sd',d),i=0;
 function scroll(){ms.scrollTop=ms.scrollHeight}
 function prep(){var s=SC[i];$('#sn',d).textContent=(i+1)+'/4';$('#sl',d).textContent=s.tag;tx.textContent='';sd.disabled=true;sd.classList.remove('go');
  var j=0;(function ty(){if(j<s.me.length){tx.textContent=s.me.slice(0,j);j+=2;setTimeout(ty,14)}else{tx.textContent=s.me;sd.disabled=false;sd.classList.add('go')}})()}
 sd.onclick=function(){if(sd.disabled)return;var s=SC[i];sd.disabled=true;sd.classList.remove('go');sfx.whoosh();vib(10);
  var b=document.createElement('div');b.className='b r';b.innerHTML='<span class="tag">'+s.tag+'</span>'+esc(s.me);ms.appendChild(b);tx.textContent='';scroll();
  var t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';setTimeout(function(){ms.appendChild(t);scroll()},450);
  setTimeout(function(){t.remove();var r=document.createElement('div');r.className='b l';r.textContent=s.rep;ms.appendChild(r);sfx.pop(.9);scroll();i++;
   if(i<SC.length)setTimeout(prep,500);
   else setTimeout(function(){var c=document.createElement('div');c.className='cal';c.innerHTML='<small>APPEL RÉSERVÉ</small><b>Demain · 18:00</b><span>Confirmé ✓</span>';ms.appendChild(c);scroll();sfx.win();vib([20,30,20]);var cc=center(c);burst(cc[0],cc[1],'conf',50);
    $('.bar',d).innerHTML='<button class="btn pulse" id="n" style="margin-top:0">Étape 4 : l’appel →</button>';steps(4);$('#n',d).onclick=function(){sfx.tap();call()}},700)},1500+Math.min(1200,s.rep.length*12))};
 setTimeout(prep,700)}

/* 4 — l'appel */
function call(){steps(4);
 var dd=D(),L=lead(),e=L.f?'e':'';
 var d=show('<div class="call"><div class="k rv">Étape 4 · Ton appel</div><div class="ring" id="rg"><div class="av" style="background:linear-gradient(135deg,'+GRAD[2]+')">'+L.n[0]+'</div></div><div class="nm">'+L.n+'</div><div class="tm" id="tm">Appel entrant…</div>'+
 '<button class="pick" id="pk" aria-label="Décrocher"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></button><div class="lines" id="ln"></div><div id="sl" style="width:100%"></div></div>');
 var ri=setInterval(sfx.ring,1200);sfx.ring();
 $('#pk',d).onclick=async function(){clearInterval(ri);sfx.ok();vib(20);this.remove();$('#rg',d).classList.add('live');
  var s=0,tm=$('#tm',d),tI=setInterval(function(){s+=7;tm.textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)},120);
  var ln=$('#ln',d),Ls=[['Tu écoutes. '+L.n+' te redit son objectif.'],['Tu lui montres le chemin pour y arriver.'],[L.n+' : « OK. Comment on commence ? »','q']];
  for(var k=0;k<Ls.length;k++){await wait(k?1700:600);var p=document.createElement('div');p.className='ln'+(Ls[k][1]?' q':'');p.textContent=Ls[k][0];ln.appendChild(p);sfx.pop(.8+k*.15);vib(8)}
  await wait(900);
  $('#sl',d).innerHTML='<div class="slide rv" id="sw"><div class="fill"></div><div class="lbl">Glisse pour l’accompagner</div><div class="knob"><svg viewBox="0 0 24 24" fill="none" stroke="#8B0A26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div>';
  slider($('#sw',d),function(){clearInterval(tI);won()})};
 function won(){S.clients=1;flash();sfx.cash();vib([30,40,30,40,80]);
  var b=document.createElement('div');b.className='bank';b.innerHTML='<i>€</i><div><b>Paiement reçu</b><span>'+(S.prod?'Ton offre ':'Coaching ')+esc(dd.l.toLowerCase())+' · '+L.n+'</span></div>';$('#sl',d).innerHTML='';$('#sl',d).appendChild(b);
  var c=center(b);burst(c[0],c[1],'coin',40);burst(c[0],c[1],'conf',70);setTimeout(sfx.win,350);
  var x=document.createElement('div');x.innerHTML='<h2 class="rv" style="margin-top:22px">'+L.n+' devient ton premi'+(L.f?'ère':'er')+' client'+e+'.</h2><p class="p rv" style="animation-delay:.15s">C’est seulement à ce moment-là que tu gagnes de l’argent. <b>Pas avant.</b></p><button class="btn pulse rv" style="animation-delay:.35s" id="n">Et maintenant ? →</button>';
  $('#sl',d).appendChild(x);$('#ln',d).style.display='none';$$('.st').forEach(function(s){s.classList.remove('cur');s.classList.add('ok')});
  setTimeout(function(){x.scrollIntoView({behavior:'smooth',block:'end'})},200);$('#n',d).onclick=function(){sfx.tap();loop()}}}

function slider(el,cb){var kn=el.querySelector('.knob'),fill=el.querySelector('.fill'),lbl=el.querySelector('.lbl'),drag=false,x0=0,max=0,cx0=0,done=false,lastQ=0;
 function pos(v){kn.style.transform='translateX('+v+'px)';fill.style.width=(v+70)+'px';lbl.style.opacity=1-v/max}
 kn.addEventListener('pointerdown',function(e){if(done)return;drag=true;x0=e.clientX;max=el.clientWidth-70;kn.setPointerCapture(e.pointerId);kn.style.transition=fill.style.transition='none'});
 kn.addEventListener('pointermove',function(e){if(!drag)return;cx0=Math.max(0,Math.min(max,e.clientX-x0));pos(cx0);var q=Math.floor(cx0/max*8);if(q!==lastQ){lastQ=q;tone(300+q*80,.04,'triangle',.06);vib(4)}if(cx0>=max*.92){drag=false;done=true;pos(max);cb()}});
 function rel(){if(!drag)return;drag=false;kn.style.transition=fill.style.transition='all .3s cubic-bezier(.2,.9,.3,1.3)';pos(0)}
 kn.addEventListener('pointerup',rel);kn.addEventListener('pointercancel',rel)}

/* 5 — la boucle : on accélère le temps */
function loop(){$('#steps').classList.remove('on');
 var NODES=[['🎬','Vidéos'],['💬','Messages'],['📞','Appels'],['🤝','Clients']];
 var d=show('<div class="col c"><div class="k rv">La boucle</div><h2 class="rv" id="lh"'+dl(1)+'>Maintenant, tu refais la boucle. Chaque semaine.</h2>'+
 '<div class="loop rv"'+dl(2)+' id="lp"><svg class="o" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="rgba(242,54,95,.18)" stroke-width="5"/><circle id="arc" cx="50" cy="50" r="38" fill="none" stroke="#F2365F" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 239" transform="rotate(-90 50 50)" style="filter:drop-shadow(0 0 4px #F2365F)"/></svg>'+
 NODES.map(function(n,i){var a=-Math.PI/2+i*Math.PI/2;return '<div class="node" style="left:'+(50+38*Math.cos(a))+'%;top:'+(50+38*Math.sin(a))+'%"><i>'+n[0]+'</i>'+n[1]+'</div>'}).join('')+
 '<div class="center"><small>Semaine</small><b id="wk">1</b><span id="wks">sur 12</span></div></div>'+
 '<div class="kpis rv"'+dl(3)+'><div><b id="k0">0</b><span>vidéos</span></div><div><b id="k1">0</b><span>messages</span></div><div><b id="k2">0</b><span>appels</span></div><div class="cl"><b id="k3">1</b><span>clients</span></div></div>'+
 '<div id="lb" style="width:100%"><button class="hold idle rv"'+dl(4)+' id="hb"><i></i><span>⏩ Maintiens pour accélérer le temps</span></button></div><p class="small rv"'+dl(5)+' style="margin-top:14px">Simulation pour comprendre la méthode. Pas une promesse.</p></div>');
 var W=[1,0,1,1,1,1,2,1,2,1,2,2],K=[0,0,0,S.clients],week=0,ph=0,fast=false,last=performance.now(),nodes=$$('.node',d),arc=$('#arc',d),stopped=false;
 var hb=$('#hb',d),fill=hb.querySelector('i');
 hb.addEventListener('pointerdown',function(e){e.preventDefault();fast=true;hb.classList.remove('idle');fill.style.width='100%';vib(10)});
 ['pointerup','pointerleave','pointercancel'].forEach(function(ev){hb.addEventListener(ev,function(){fast=false;fill.style.width='0';hb.classList.add('idle')})});
 hb.addEventListener('contextmenu',function(e){e.preventDefault()});
 var lastNode=-1;
 (function tick(t){if(stopped)return;var dt=Math.min(.05,(t-last)/1000);last=t;ph+=dt*(fast?3.2:.62);
  var qn=Math.floor(ph*4)%4;arc.setAttribute('stroke-dasharray',((ph%1)*239).toFixed(1)+' 239');
  if(qn!==lastNode){lastNode=qn;nodes.forEach(function(n,i){n.classList.toggle('hit',i===qn)});tone([440,523,659,784][qn],.06,'triangle',.05);
   if(qn===0){K[0]+=5}if(qn===1){K[1]+=22+Math.floor(Math.random()*16)}if(qn===2){K[2]+=3+Math.floor(Math.random()*3)}
   if(qn===3&&W[week]){K[3]+=W[week];var el=$('#k3',d);el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');sfx.coin();vib(15);var c=center(el);burst(c[0],c[1],'coin',14)}
   for(var j=0;j<3;j++)$('#k'+j,d).textContent=fmt(K[j]);$('#k3',d).textContent=K[3]}
  var w=Math.floor(ph);if(w!==week){week=w;if(week>=12){end();return}$('#wk',d).textContent=week+1}
  requestAnimationFrame(tick)})(last);
 function end(){stopped=true;S.clients=K[3];S.k=K.slice();nodes.forEach(function(n){n.classList.add('hit')});arc.setAttribute('stroke-dasharray','239 239');
  $('#wk',d).textContent=K[3];$('.center small',d).textContent='En 3 mois';$('#wks',d).textContent='clients';
  flash();sfx.win();vib([30,40,30,40,80]);var c=center($('#lp',d));burst(c[0],c[1],'conf',90);burst(c[0],c[1],'coin',30);
  $('#lh',d).textContent='3 mois plus tard : '+K[3]+' clients.';
  $('#lb',d).innerHTML='<p class="p rv">Tout est parti de ce que tu sais faire, et de quelques vidéos. Ça, c’était le jeu.</p><button class="btn pulse rv" style="animation-delay:.25s" id="n">Voir ce que ça donne en vrai →</button>';
  setTimeout(function(){$('#lb',d).scrollIntoView({behavior:'smooth',block:'end'})},200);$('#n',d).onclick=function(){sfx.tap();proof()}}}

/* 6 — la preuve : l'élève miroir */
function proof(){
 var mk=MIRROR[S.sit]||'adrien',m=EL[mk],rest=Object.keys(EL).filter(function(k){return k!==mk});
 var d=show('<div class="col c"><div class="k rv">Pas un jeu : la réalité</div><h2 class="rv"'+dl(1)+'>'+esc(S.name)+', voilà '+m.n+'.</h2><p class="p rv"'+dl(2)+'>'+m.t+'. Même méthode que celle que tu viens de jouer.</p>'+
 '<div class="proof rv"'+dl(3)+' id="pf" style="background-image:url('+m.img+')"><button class="ov" id="pp"><span class="play"><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg></span><span class="r" id="pr">'+m.r+'</span><span class="n" id="pn">'+m.n+' · '+m.t+'</span></button></div>'+
 '<div class="others rv"'+dl(4)+'>'+[mk].concat(rest).map(function(k,i){var e=EL[k];return '<button class="oth'+(i?'':' cur')+'" data-k="'+k+'" style="background-image:url('+e.img+')"><span>'+e.n+'<br>'+e.r+'</span></button>'}).join('')+'</div>'+
 '<p class="small rv"'+dl(5)+' style="margin-top:10px">Résultats individuels, qui dépendent du travail de chacun et ne sont pas garantis.</p>'+
 '<button class="btn pulse rv"'+dl(6)+' id="n">Je veux faire pareil →</button></div>');
 var pf=$('#pf',d),cur=mk;
 function play(k){var e=EL[k];cur=k;pf.innerHTML='<video src="'+e.v+'" poster="'+e.img+'" controls playsinline autoplay></video>';var v=pf.querySelector('video');v.play().catch(function(){});sfx.tap();
  $$('.oth',d).forEach(function(o){o.classList.toggle('cur',o.dataset.k===k)})}
 $('#pp',d).onclick=function(){play(cur)};
 $$('.oth',d).forEach(function(o){o.onclick=function(){play(o.dataset.k);pf.scrollIntoView({behavior:'smooth',block:'center'})}});
 $('#n',d).onclick=function(){var v=pf.querySelector('video');if(v)v.pause();sfx.ok();fin()}}

/* 7 — fin : réserver la séance */
function fin(){
 var dd=D(),K=S.k||[0,0,0,S.clients];
 var d=show('<div class="col c"><div class="k rv">Ton parcours</div><h2 class="rv"'+dl(1)+'>'+esc(S.name)+', la suite se fait avec un coach.</h2>'+
 '<div class="ticket rv"'+dl(2)+'>'+
 '<div class="tk"><i>1</i><span>Ton offre</span><b>'+(S.prod?'Offre ':'Coaching ')+esc(dd.l.toLowerCase())+'</b></div>'+
 '<div class="tk"><i>2</i><span>Ta vidéo</span><b>'+fmt(S.views)+' vues</b></div>'+
 '<div class="tk"><i>3</i><span>Tes messages</span><b>'+S.int+' intéressés</b></div>'+
 '<div class="tk"><i>4</i><span>Ton appel</span><b>1er client</b></div></div>'+
 '<ul class="ul rv"'+dl(3)+'><li><i>✓</i>Ton appel stratégique est offert.</li><li><i>✓</i>Au QG à Paris, ou en visio si tu es loin.</li><li><i>✓</i>Avec ton coach, tu poses ton offre et tu repères les vidéos qui marchent dans ton domaine.</li></ul>'+
 '<a class="btn pulse rv"'+dl(4)+' id="bk" href="'+BOOK+'">Je réserve mon appel stratégique →</a>'+
 '<button class="lnk rv"'+dl(5)+' id="again">Rejouer</button></div>');
 setTimeout(function(){var c=center($('#bk',d));burst(c[0],c[1],'conf',40)},700);
 try{sessionStorage.setItem('aud-jeu',JSON.stringify({prenom:S.name,situation:S.sit,produit:S.prod,domaine:dd.l}))}catch(e){}
 $('#again',d).onclick=function(){S={name:'',sit:null,prod:null,dom:null,views:0,int:0,clients:0};$$('.st').forEach(function(s){s.className='st'});intro()}}

/* fermer le clavier sur iOS quand on change d'écran */
document.addEventListener('touchmove',function(){},{passive:true});
intro();
})();
