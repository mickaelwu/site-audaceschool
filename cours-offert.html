<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ton cours offert — École AUDACE</title>
<meta name="description" content="Regarde la vidéo, puis choisis ton créneau pour ton cours offert à l'École AUDACE.">
<meta property="og:title" content="Ton cours offert — École AUDACE">
<meta property="og:description" content="Regarde la vidéo, puis choisis ton créneau.">
<meta property="og:image" content="https://audaceschool.com/img/og.jpg">
<meta name="robots" content="noindex">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
:root{--b:#67061B;--bd:#4A0414;--ink:#1E1012;--cream:#FBF7F2;--sand:#F3EBE4;--mut:#6B5558}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.w{max-width:880px;margin:0 auto;padding:0 18px}
.top{display:flex;justify-content:center;padding:18px 0 6px}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1;text-decoration:none;color:var(--b)}
.logo b{font-family:'Instrument Sans',sans-serif;font-size:26px;letter-spacing:.03em}
.logo small{font-size:8px;font-weight:800;letter-spacing:.36em;margin-top:3px}
.k{display:inline-block;margin:22px 0 12px;padding:7px 13px;border-radius:999px;background:var(--b);color:var(--cream);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1,h2{font-family:'Instrument Sans','Inter',sans-serif;font-weight:700;letter-spacing:-.025em;line-height:1.05;margin:0}
h1{font-size:clamp(30px,6vw,48px)}
.head{text-align:center}
.vsl{margin:24px 0 0;border-radius:20px;overflow:hidden;background:#14030A;box-shadow:0 18px 50px rgba(30,16,18,.18)}
.vsl video{display:block;width:100%;max-height:78vh;background:#14030A}
.cal{margin:44px 0 60px;text-align:center}
.cal h2{font-size:clamp(28px,5vw,40px)}
.cal p{color:var(--mut);margin:10px 0 22px}
.box{border-radius:20px;background:#fff;box-shadow:0 12px 34px rgba(30,16,18,.08);overflow:hidden;min-height:620px}
.iclosed-widget{width:100%;height:720px}
.fb{display:none;padding:40px 20px}
.fb a{display:inline-flex;align-items:center;justify-content:center;min-height:58px;padding:0 28px;border-radius:16px;background:var(--b);color:var(--cream);font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div class="w">
  <header class="top"><a class="logo" href="./"><b>AUDACE</b><small>ÉCOLE D'ENTREPRENEURIAT</small></a></header>

  <div class="head">
    <span class="k">Étape 1 · Regarde la vidéo</span>
    <h1>Avant de réserver ton cours offert, regarde cette vidéo.</h1>
  </div>
  <div class="vsl" id="vsl">
    <video id="v" controls playsinline preload="metadata" poster="img/og.jpg">
      <source src="media/vsl.mp4" type="video/mp4">
    </video>
  </div>

  <section class="cal" id="cal">
    <span class="k">Étape 2 · Ton créneau</span>
    <h2>Choisis ton créneau.</h2>
    <p>C'est gratuit. Une heure en tête à tête avec un coach, au QG à Paris ou en visio.</p>
    <div class="box">
      <div class="iclosed-widget" data-url="https://app.iclosed.io/e/mickaelwu/cours-d-essai-audace-en-ligne" title="Cours offert AUDACE"></div>
      <div class="fb" id="fb"><a href="https://app.iclosed.io/e/mickaelwu/cours-d-essai-audace-en-ligne" target="_blank" rel="noopener">Ouvrir l'agenda →</a></div>
    </div>
  </section>
</div>

<script src="https://app.iclosed.io/assets/widget.js" async></script>
<script>
// tant que la VSL n'est pas en ligne, on cache le lecteur : la page affiche seulement l'agenda
var v=document.getElementById('v'),s=v.querySelector('source');
function noVsl(){document.getElementById('vsl').style.display='none';document.querySelector('.head').style.display='none';document.querySelector('#cal .k').textContent='Ton cours offert'}
fetch(s.getAttribute('src'),{method:'HEAD',cache:'no-store'}).then(function(r){if(!r.ok)noVsl()}).catch(noVsl);
// si l'agenda ne s'affiche pas, on propose le lien direct
setTimeout(function(){var w=document.querySelector('.iclosed-widget');if(!w.querySelector('iframe')){w.style.display='none';w.parentNode.style.minHeight='0';document.getElementById('fb').style.display='block'}},7000);
</script>
</body>
</html>
